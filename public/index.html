
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Pohon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 720px;
      margin: 60px auto;
      padding: 24px;
      background: #f5f7f2;
      color: #283b2d;
    }

    .container {
      background: white;
      padding: 32px;
      border: 1px solid #e3e9df;
      border-radius: 12px;
    }

    h1 {
      margin-top: 0;
      color: #2f6845;
      font-size: 28px;
    }

    .subtitle {
      color: #718074;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    h2 {
      font-size: 18px;
      margin-top: 32px;
      padding-bottom: 12px;
      border-bottom: 1px solid #e6ebe3;
    }

    form {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #d5ddd3;
      border-radius: 7px;
      font-size: 14px;
    }

    input:focus {
      outline: 2px solid #b9d7c1;
      border-color: #4c865f;
    }

    button {
      padding: 12px 16px;
      background: #39744d;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #2c5e3d;
    }

    #daftarPohon {
      list-style: none;
      padding: 0;
    }

    #daftarPohon li {
      padding: 14px 16px;
      margin-bottom: 8px;
      background: #f5f8f3;
      border: 1px solid #e7eee3;
      border-radius: 7px;
    }

    .footer {
      margin-top: 28px;
      color: #89948a;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        margin: 20px auto;
        padding: 12px;
      }

      .container {
        padding: 22px;
      }

      form {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Data Pohon</h1>
    <p class="subtitle">
      Catat dan kelola daftar pohon dalam satu tempat.
    </p>

    <form id="formPohon">
      <input
        id="nama"
        type="text"
        placeholder="Masukkan nama pohon"
        required
      >
      <button type="submit">Tambah Pohon</button>
    </form>

    <h2>Daftar Pohon</h2>
    <ul id="daftarPohon"></ul>

    <p class="footer">Pencatatan Data Pohon</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
